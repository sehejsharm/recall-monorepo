name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests (SM-2, scheduler, drill store, sync)
        run: pnpm test

      - name: Typecheck (core, content, web, mobile)
        run: pnpm typecheck

      - name: Build web (static export of all exam/topic/review routes)
        run: pnpm --filter @jyotir/web build

      - name: Export mobile bundles (iOS + Android, Hermes)
        run: pnpm --filter @jyotir/mobile exec expo export --platform ios --platform android --output-dir /tmp/expo-export
        env:
          CI: "1"

  # WCAG 2.1 AA gate. Runs axe-core against every route plus the first-run
  # onboarding overlay, and asserts the drill is operable keyboard-only.
  # Fails on any critical/serious violation, so a11y regressions can't merge.
  # Also runs the offline suite, which holds the "works fully offline" store
  # claim honest (drilling with the network cut, progress surviving reconnect).
  accessibility-and-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm --filter @jyotir/web exec playwright install --with-deps chromium

      # NEXT_PUBLIC_E2E_ERROR_HOOK compiles in the ?__boom=1 render-throw used
      # to prove the route error boundary catches. It is set ONLY here — never
      # in the Vercel production build — so the throw is unreachable in prod.
      - name: Build web (with e2e error hook)
        run: pnpm --filter @jyotir/web build
        env:
          NEXT_PUBLIC_E2E_ERROR_HOOK: "1"

      - name: Accessibility (axe-core) + offline + error-boundary e2e
        run: pnpm --filter @jyotir/web exec playwright test
        env:
          CI: "1"
          NEXT_PUBLIC_E2E_ERROR_HOOK: "1"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # The backend `questions` table once drifted 8,000+ questions behind the
  # shipped bundle, FK-failing every progress sync for new content. This job
  # makes that class of bug impossible to merge: the committed seed must
  # always match what `scripts/generate-seed.ts` emits from @jyotir/content.
  seed-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate seed from the content bundle
        run: pnpm seed:generate

      - name: Fail if supabase/seed.sql or setup.sql is out of date
        run: |
          if ! git diff --exit-code -- supabase/seed.sql supabase/setup.sql; then
            echo "::error::supabase/seed.sql is stale — run 'pnpm seed:generate' and commit the result."
            exit 1
          fi

      # packages/content/src/catalog.ts duplicates exam metadata so the exam
      # pickers don't drag the 5.7 MB question corpus into the client bundle.
      # A duplicate is only safe while it cannot drift.
      - name: Regenerate the exam catalog
        run: pnpm catalog:generate

      - name: Fail if packages/content/src/catalog.ts is out of date
        run: |
          if ! git diff --exit-code -- packages/content/src/catalog.ts; then
            echo "::error::catalog.ts is stale — run 'pnpm catalog:generate' and commit the result."
            exit 1
          fi
